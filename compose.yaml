name: brewlite-a2

services:
  db:
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: brewlite_a2
      POSTGRES_USER: brewlite
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Missing POSTGRES_PASSWORD}
      TZ: UTC
    command: ["postgres", "-c", "timezone=UTC"]
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U brewlite -d brewlite_a2"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    image: brewlite-a2-api:local
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      NODE_ENV: production
      TZ: UTC
      PORT: "3001"
      DATABASE_URL: postgresql://brewlite:${POSTGRES_PASSWORD:?Missing POSTGRES_PASSWORD}@db:5432/brewlite_a2?schema=public
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:?Missing AUTH_JWT_SECRET}
      FRONTEND_ORIGIN: http://localhost:3100
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 12

  frontend:
    image: brewlite-a2-web:local
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_PRODUCTS_SOURCE: api
        NEXT_PUBLIC_AUTH_SOURCE: http
    environment:
      NODE_ENV: production
      TZ: UTC
      PORT: "3000"
      BACKEND_INTERNAL_URL: http://backend:3001
      APP_ORIGIN: http://localhost:3100
      AUTH_COOKIE_NAME: brewlite_a2_session
    ports:
      - "127.0.0.1:3100:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 12

volumes:
  postgres_data: