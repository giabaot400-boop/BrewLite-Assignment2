# CI cho Pull Request và main (A2-REPO-CI, Task 4).
# Thứ tự bắt buộc: cài đặt -> lint -> typecheck -> test -> build.
# Docker chỉ publish sau khi verify thành công trên main.

name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy:
        description: "Deploy the verified main images to Railway (requires prepared DB/stock and environment configuration)"
        type: boolean
        required: true
        default: false

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  verify:
    name: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_PRODUCTS_SOURCE: fixture
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js (theo .nvmrc)
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Ghi phiên bản môi trường
        run: |
          node --version
          npm --version
          echo "### Môi trường CI" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit: \`${GITHUB_SHA}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Node: $(node --version), npm: $(npm --version)" >> "$GITHUB_STEP_SUMMARY"

      - name: Cài đặt (theo lockfile)
        run: npm ci --ignore-scripts

      - name: Sinh Prisma Client (không cần database)
        run: npm run db:generate

      - name: Lint
        run: npm run lint

      - name: Typecheck (web và api)
        run: npm run typecheck

      - name: Unit test (web và api)
        run: npm test

      - name: Test script cấu hình local
        run: node --test scripts/setup-env.test.mjs

      - name: Test delivery guards, smoke and rollout failure paths
        run: npm run test:delivery

      - name: Build (web và api)
        run: npm run build

      - name: Ghi kết quả
        if: always()
        run: |
          echo "- Kết quả job: ${{ job.status }}" >> "$GITHUB_STEP_SUMMARY"

  publish:
    name: publish-ghcr
    runs-on: ubuntu-24.04
    needs: verify
    if: ${{ needs.verify.result == 'success' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
    timeout-minutes: 30
    outputs:
      api_digest: ${{ steps.build-api.outputs.digest }}
      web_digest: ${{ steps.build-web.outputs.digest }}

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # API image
      - name: API metadata
        id: meta-api
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/giabaot400-boop/brewlite-a2-api
          tags: |
            type=raw,value=latest
            type=sha,format=long,prefix=sha-

      - name: Build and Push API
        id: build-api
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: ${{ steps.meta-api.outputs.tags }}
          labels: ${{ steps.meta-api.outputs.labels }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      # Web image
      - name: Web metadata
        id: meta-web
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/giabaot400-boop/brewlite-a2-web
          tags: |
            type=raw,value=latest
            type=sha,format=long,prefix=sha-

      - name: Build and Push Web
        id: build-web
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: ${{ steps.meta-web.outputs.tags }}
          labels: ${{ steps.meta-web.outputs.labels }}
          build-args: |
            BREWLITE_BUILD_SHA=${{ github.sha }}
            NEXT_PUBLIC_PRODUCTS_SOURCE=api
            NEXT_PUBLIC_AUTH_SOURCE=http
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      - name: Record image digests
        run: |
          echo "## GHCR Publish Results" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Source SHA: \`${GITHUB_SHA}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          echo "### API" >> "$GITHUB_STEP_SUMMARY"
          echo "- Image: \`ghcr.io/giabaot400-boop/brewlite-a2-api\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Tag: \`latest\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Tag: \`sha-${GITHUB_SHA}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Digest: \`${{ steps.build-api.outputs.digest }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          echo "### Web" >> "$GITHUB_STEP_SUMMARY"
          echo "- Image: \`ghcr.io/giabaot400-boop/brewlite-a2-web\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Tag: \`latest\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Tag: \`sha-${GITHUB_SHA}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Digest: \`${{ steps.build-web.outputs.digest }}\`" >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: deploy-railway-and-smoke
    needs: [verify, publish]
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.deploy && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    environment: railway-production
    concurrency:
      group: railway-production
      cancel-in-progress: false
    env:
      RAILWAY_PROJECT_ID: ${{ vars.RAILWAY_PROJECT_ID }}
      RAILWAY_ENVIRONMENT_ID: ${{ vars.RAILWAY_ENVIRONMENT_ID }}
      RAILWAY_API_SERVICE_ID: ${{ vars.RAILWAY_API_SERVICE_ID }}
      RAILWAY_WEB_SERVICE_ID: ${{ vars.RAILWAY_WEB_SERVICE_ID }}
      RAILWAY_DEPLOY_READY: ${{ vars.RAILWAY_DEPLOY_READY }}
      SMOKE_BASE_URL: ${{ vars.SMOKE_BASE_URL }}
      API_IMAGE: ghcr.io/giabaot400-boop/brewlite-a2-api@${{ needs.publish.outputs.api_digest }}
      WEB_IMAGE: ghcr.io/giabaot400-boop/brewlite-a2-web@${{ needs.publish.outputs.web_digest }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
      - name: Deploy pinned API then Web and wait for completion
        env:
          RAILWAY_PROJECT_TOKEN: ${{ secrets.RAILWAY_PROJECT_TOKEN }}
        run: node scripts/railway-deploy.mjs --deploy
      - name: Read-only smoke on the released HTTPS application
        run: node tests/smoke.mjs --report delivery-artifacts/smoke.json
      - name: Retain deployment IDs, previous pins and smoke results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: railway-release-${{ github.sha }}-${{ github.run_attempt }}
          path: delivery-artifacts/
          if-no-files-found: warn
          retention-days: 7
      - name: Rollback guidance on failure
        if: failure()
        run: echo "Release failed. Inspect recorded deployment IDs, then docs/deployment.md. Do not reverse migrations or restore production automatically."
